name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.alpine && 'alpine-' || '' }}${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04            # linux x64 (glibc)
          - runner: ubuntu-26.04-arm        # linux arm64 (glibc)
          - runner: macos-14                # macos arm64 (Apple silicon)
          - runner: windows-latest          # windows x64
          - runner: windows-11-arm          # windows arm64
          - runner: ubuntu-26.04            # alpine x64 (musl, vía Docker)
            alpine: true
          - runner: ubuntu-26.04-arm        # alpine arm64 (musl, vía Docker)
            alpine: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: ${{ !matrix.alpine }}
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        if: ${{ !matrix.alpine }}
        run: python -m pip install -q -r requirements-build.txt

      - name: Empaquetar Alpine/musl en Docker
        if: matrix.alpine
        run: |
          docker run --rm -v "$PWD":/work -w /work alpine:3.20 \
            sh -c "apk add --no-cache python3 py3-pip build-base binutils libc6-compat && \
            python3 -m pip install -q --break-system-packages pyinstaller && \
            python3 tools/build_ci.py && \
            BIN=\$(ls dist/uc-drive-downloader-alpine-*) && chmod +x \$BIN && ./\$BIN --version"

      - name: Empaquetar binario onefile
        if: ${{ !matrix.alpine }}
        run: python tools/build_ci.py
      - name: Calcular checksum SHA-256
        shell: bash
        run: |
          cd dist
          python - <<'PY'
          import glob, hashlib, os
          for f in sorted(glob.glob('*')):
              if not os.path.isfile(f) or f.endswith('.sha256'):
                  continue
              h = hashlib.sha256()
              with open(f, 'rb') as fp:
                  for chunk in iter(lambda: fp.read(1 << 20), b''):
                      h.update(chunk)
              with open(f + '.sha256', 'w') as out:
                  out.write(f"{h.hexdigest()}  {os.path.basename(f)}\n")
          PY
          ls -la
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runner }}
          path: dist/*

  release:
    name: publicar release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Descargar binarios
        uses: actions/download-artifact@v4
        with:
          path: binarios
          merge-multiple: true
      - name: Crear/actualizar Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: false
          files: binarios/*
          fail_on_unmatched_files: true
          body: |
            ## uc-drive-downloader ${{ github.ref_name }}

            Descargador **sin cuenta** de shares públicas de UC Drive
            (internacional). Descarga reanudable con barra de progreso
            (%, velocidad, ETA) y verificación de tamaño + MD5.

            Cada binario es **autocontenido** (PyInstaller `--onefile`):
            no requiere Python instalado y va acompañado de su checksum
            `*.sha256`.

            ### Binarios por plataforma

            | Archivo | Plataforma / libc |
            |---|---|
            | `uc-drive-downloader-linux-x64` | Linux x86_64 (glibc) |
            | `uc-drive-downloader-linux-arm64` | Linux ARM64 (glibc) — Raspberry Pi, Termux/proot |
            | `uc-drive-downloader-alpine-x64` | Linux x86_64 **musl** (Alpine, distros musl) |
            | `uc-drive-downloader-alpine-arm64` | Linux ARM64 **musl** (Alpine) |
            | `uc-drive-downloader-macos-arm64` | macOS Apple Silicon |
            | `uc-drive-downloader-windows-x64.exe` | Windows 64 bits |
            | `uc-drive-downloader-windows-arm64.exe` | Windows on ARM |

            ### Por qué estas combinaciones y no otras

            - **glibc vs musl**: un binario compilado contra glibc (Ubuntu)
              no corre en distros musl (Alpine, etc.), y viceversa. Por eso
              hay builds `linux-*` (glibc) y `alpine-*` (musl) por arquitectura.
            - **macOS Intel (`macos-x64`)**: se descarta porque el runner
              macOS Intel es muy lento en CI; el binario `macos-arm64`
              también funciona en Macs Intel via Rosetta 2.
            - **Windows ARM**: se añade ahora que GitHub ofrece el runner
              `windows-11-arm`. El binario x64 también corre en Windows ARM
              por emulación.
            - **Solo CLI**: no hay versión GUI; todos los binarios son la
              misma interfaz de línea de comandos.

            ### Uso

            ```bash
            # Linux / macOS / Alpine — dar permiso de ejecución
            chmod +x uc-drive-downloader-linux-x64
            ./uc-drive-downloader-linux-x64 info "https://uc-share.com/s/577cf9ba429a4?la=es-la"
            ./uc-drive-downloader-linux-x64 download 577cf9ba429a4 --all

            # Windows
            uc-drive-downloader-windows-x64.exe view 577cf9ba429a4 --file "video.mp4" --url
            ```

            Para una **verificación de integridad** al descargar un binario:

            ```bash
            sha256sum -c uc-drive-downloader-linux-x64.sha256   # linux/macos
            certutil -hashfile uc-drive-downloader-windows-x64.exe SHA256  # windows
            ```

            > Herramienta educativa / de uso personal. Úsala solo con
            > contenido que tengas derecho a descargar.