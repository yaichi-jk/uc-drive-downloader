name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04            # linux x64
          - runner: ubuntu-26.04-arm        # linux arm64
          - runner: macos-14                # macos arm64 (Apple silicon)
          - runner: windows-latest          # windows x64
          - runner: windows-11-arm          # windows arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: python -m pip install -q -r requirements-build.txt

      - name: Empaquetar binario onefile
        run: python tools/build_ci.py
      - name: Calcular checksum SHA-256
        shell: bash
        run: |
          cd dist
          python - <<'PY'
          import glob, hashlib, os
          for f in sorted(glob.glob('*')):
              if not os.path.isfile(f) or f.endswith('.sha256'):
                  continue
              h = hashlib.sha256()
              with open(f, 'rb') as fp:
                  for chunk in iter(lambda: fp.read(1 << 20), b''):
                      h.update(chunk)
              with open(f + '.sha256', 'w') as out:
                  out.write(f"{h.hexdigest()}  {os.path.basename(f)}\n")
          PY
          ls -la
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runner }}
          path: dist/*

  release:
    name: publicar release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Descargar binarios
        uses: actions/download-artifact@v4
        with:
          path: binarios
          merge-multiple: true
      - name: Crear/actualizar Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: false
          files: binarios/*
          fail_on_unmatched_files: true
          body: |
            ## uc-drive-downloader ${{ github.ref_name }}

            Descargador **sin cuenta** de shares públicas de UC Drive
            (internacional). Descarga reanudable con barra de progreso
            (%, velocidad, ETA) y verificación de tamaño + MD5.

            Cada binario es **autocontenido** (PyInstaller `--onefile`):
            no requiere Python instalado y va acompañado de su checksum
            `*.sha256`.

            ### Binarios por plataforma

            | Archivo | Plataforma |
            |---|---|
            | `uc-drive-downloader-linux-x64` | Linux x86_64 |
            | `uc-drive-downloader-linux-arm64` | Linux ARM64 — Raspberry Pi, Termux/proot |
            | `uc-drive-downloader-macos-arm64` | macOS Apple Silicon |
            | `uc-drive-downloader-windows-x64.exe` | Windows 64 bits |
            | `uc-drive-downloader-windows-arm64.exe` | Windows on ARM |

            ### Por qué estas combinaciones y no otras

            - **Linux Alpine (musl)**: se descartó porque la compilación
              cruzada musl falló en CI a la primera. En distros Alpine usa
              el binario `linux-*` con la libc compatible de tu sistema.
            - **macOS Intel (`macos-x64`)**: se descarta porque el runner
              macOS Intel es muy lento en CI; el binario `macos-arm64`
              también funciona en Macs Intel via Rosetta 2.
            - **Windows ARM**: binario nativo `windows-arm64`, compilado en
              el runner hosteado `windows-11-arm` de GitHub. El `windows-x64`
              también corre en Windows ARM por emulación.
            - **Solo CLI**: no hay versión GUI; todos los binarios son la
              misma interfaz de línea de comandos.

            ### Uso

            ```bash
            # Linux / macOS / Termux — permiso de ejecución la primera vez
            chmod +x uc-drive-downloader-linux-x64
            ./uc-drive-downloader-linux-x64 info "https://uc-share.com/s/577cf9ba429a4?la=es-la"
            ./uc-drive-downloader-linux-x64 download 577cf9ba429a4 --all

            # Windows — no necesita chmod
            uc-drive-downloader-windows-x64.exe view 577cf9ba429a4 --file "video.mp4" --url
            ```

            ### Notas por plataforma

            - **Linux / macOS / Termux**: requiere `chmod +x` la primera vez.
            - **macOS (descarga con Safari/Chrome)**: quita la cuarentena
              con `xattr -d com.apple.quarantine uc-drive-downloader-macos-arm64`
              antes de ejecutarlo.
            - **Windows**: no necesita chmod; la primera vez SmartScreen puede
              pedir confirmación (*More info → Run anyway*).
            - **Windows on ARM**: usa el binario nativo `windows-arm64.exe`;
              el `windows-x64.exe` también funciona por emulación.

            Para una **verificación de integridad** al descargar un binario:

            ```bash
            sha256sum -c uc-drive-downloader-linux-x64.sha256   # linux/macos
            certutil -hashfile uc-drive-downloader-windows-x64.exe SHA256  # windows
            ```

            > Herramienta educativa / de uso personal. Úsala solo con
            > contenido que tengas derecho a descargar.